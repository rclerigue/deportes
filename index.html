<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Selector de Deportes — ¿Qué practicas?</title>
  <style>
    :root{
      --bg1:#059669; /* emerald */
      --bg2:#0ea5e9; /* sky */
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#ef4444; /* red accent */
      --radius:14px;
      --ghost-border: rgba(15,23,42,0.08);
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      color:#0f172a;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:28px;
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.98), var(--card));
      width:min(640px,96vw);
      border-radius:var(--radius);
      box-shadow:0 18px 60px rgba(15, 23, 42, 0.45);
      padding:28px;
      display:grid;
      gap:18px;
      align-items:start;
    }

    header{
      display:flex;
      gap:16px;
      align-items:center;
    }
    .logo{
      width:64px;
      height:64px;
      border-radius:12px;
      background:linear-gradient(135deg, rgba(5,150,105,0.12), rgba(14,165,233,0.08));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      color:var(--bg1);
      font-size:20px;
      flex:0 0 64px;
      border:1px solid rgba(15,23,42,0.04);
    }
    h1{ margin:0; font-size:1.6rem; color:var(--bg1); }
    p.lead{ margin:0; color:var(--muted); font-size:0.98rem; }

    form{
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    fieldset {
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    legend {
      font-weight: 600;
      color: var(--bg1);
      padding: 0 8px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--bg1);
    }
    label { font-size: 1rem; }
    input[type="text"]{
      padding:8px 12px;
      border-radius:8px;
      border:1px solid rgba(15,23,42,0.1);
      outline:none;
      font-size:0.95rem;
      transition: box-shadow .12s;
      width: 100%;
    }
    input[type="text"]:focus{
      box-shadow:0 0 0 3px rgba(5,150,105,0.2);
      border-color: var(--bg1);
    }

    .actions{ display:flex; gap:10px; margin-top:6px; }
    button.primary{
      background:linear-gradient(90deg,var(--bg1),var(--bg2));
      border:0;
      color:white;
      padding:12px 18px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 12px 30px rgba(14,165,233,0.14);
    }
    button.ghost, a.ghost{
      background:transparent;
      border:1px solid var(--ghost-border);
      padding:11px 16px;
      border-radius:10px;
      cursor:pointer;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
    }

    .results{
      background: linear-gradient(180deg, rgba(250,250,250,0.6), rgba(255,255,255,0.55));
      border-radius:12px;
      padding:18px;
      min-height: 80px;
      border:1px solid rgba(15,23,42,0.04);
    }
    .results h2 { margin: 0 0 10px 0; font-size: 1.1rem; color: var(--muted); }
    .results ul { margin: 0; padding-left: 20px; }
    .results li { margin-bottom: 4px; }
    .fade-in{ animation:fadeIn .5s ease both; }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }

    footer{
      font-size:0.85rem;
      color:var(--muted);
      margin-top:6px;
    }
  </style>
</head>
<body>

  <main class="card" role="main" aria-labelledby="title">
    <header>
      <div class="logo" aria-hidden="true">🏃</div>
      <div>
        <h1 id="title">¿Qué deportes practicas?</h1>
        <p class="lead">Selecciona tus deportes favoritos y guarda tu selección.</p>
      </div>
    </header>

    <form id="sportsForm" novalidate>
      <fieldset>
        <legend>1. Dinos tu nombre</legend>
        <div>
          <label for="nombre" style="font-weight:500; font-size:0.9rem; margin-bottom:4px;">Tu nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre aquí..." required>
        </div>
      </fieldset>
      <fieldset>
        <legend>Elige uno o más deportes</legend>
        <div class="checkbox-group"><input type="checkbox" id="futbol" name="sport" value="Fútbol"><label for="futbol">Fútbol</label></div>
        <div class="checkbox-group"><input type="checkbox" id="baloncesto" name="sport" value="Baloncesto"><label for="baloncesto">Baloncesto</label></div>
        <div class="checkbox-group"><input type="checkbox" id="tenis" name="sport" value="Tenis"><label for="tenis">Tenis</label></div>
        <div class="checkbox-group"><input type="checkbox" id="natacion" name="sport" value="Natación"><label for="natacion">Natación</label></div>
        <div class="checkbox-group"><input type="checkbox" id="ciclismo" name="sport" value="Ciclismo"><label for="ciclismo">Ciclismo</label></div>
        <div class="checkbox-group"><input type="checkbox" id="gym" name="sport" value="Gimnasio"><label for="gym">Gimnasio</label></div>
        <div class="checkbox-group"><input type="checkbox" id="otro" name="sport" value="Otro"><label for="otro">Otro:</label></div>
        <input type="text" id="otroText" name="otroText" placeholder="Escribe aquí..." aria-label="Otro deporte">
      </fieldset>

      <div class="actions">
        <button type="submit" class="primary">Guardar selección</button>
        <a href="./resultados.html" class="ghost">Ver resultados</a>
      </div>
    </form>

    <section class="results" id="results" aria-live="polite">
      <h2>Última selección guardada:</h2>
      <p id="resultsText">Aún no has guardado tu selección.</p>
    </section>

    <footer>
      <div class="small">Tus selecciones se guardan localmente en este navegador.</div>
    </footer>
  </main>

  <script>
    // Selecciones del DOM
    const form = document.getElementById('sportsForm');
    const nombreInput = document.getElementById('nombre');
    const resultsText = document.getElementById('resultsText');
    const resultsContainer = document.getElementById('results');
    const otroCheckbox = document.getElementById('otro');
    const otroTextInput = document.getElementById('otroText');

    const STORAGE_KEY = 'sportsTrackerData';

    // Guarda la selección y actualiza la vista
    function guardarDeportes(e) {
      e.preventDefault();
      const nombre = nombreInput.value.trim();
      if (!nombre) {
        alert('Por favor, introduce tu nombre.');
        nombreInput.focus();
        return;
      }

      const selectedSports = [];
      const checkboxes = form.querySelectorAll('input[type="checkbox"]:checked');

      checkboxes.forEach(checkbox => {
        if (checkbox.id === 'otro') {
          const otroValor = otroTextInput.value.trim();
          if (otroValor) {
            selectedSports.push(otroValor);
          }
        } else {
          selectedSports.push(checkbox.value);
        }
      });

      // Cargar datos existentes, añadir el nuevo y guardar
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const newEntry = {
        name: nombre,
        sports: selectedSports,
        date: new Date().toISOString()
      };
      data.push(newEntry);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      // Actualizar la vista
      actualizarVista(newEntry);
      resultsContainer.classList.remove('fade-in');
      void resultsContainer.offsetWidth; // Forzar reflow para reiniciar animación
      resultsContainer.classList.add('fade-in');
    }

    // Actualiza la lista de deportes en la vista
    function actualizarVista(entry) {
      if (!entry || entry.sports.length === 0) {
        resultsText.innerHTML = 'Aún no has guardado tu selección.';
        return;
      }

      let listHtml = `<p><strong>${escapeHtml(entry.name)}</strong> practica:</p><ul>`;
      entry.sports.forEach(sport => {
        listHtml += `<li>${escapeHtml(sport)}</li>`;
      });
      listHtml += '</ul>';
      resultsText.innerHTML = listHtml;
    }

    // Carga los datos guardados al iniciar la página
    function cargarDatosGuardados() {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const lastEntry = data[data.length - 1];
      if (!lastEntry) return;

      actualizarVista(lastEntry);

      // Marcar los checkboxes correspondientes
      // No recargamos los checkboxes para permitir nuevas entradas limpias.
      // El usuario puede ver la última entrada guardada abajo.
    }

    // Función para escapar HTML y prevenir XSS
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // Event Listeners
    form.addEventListener('submit', guardarDeportes);

    // Inicialización
    document.addEventListener('DOMContentLoaded', cargarDatosGuardados);
  </script>
</body>
</html>
